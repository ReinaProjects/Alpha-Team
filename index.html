<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --noite:#000;--escudo:#061633;--escudo-2:#0b2a63;--azul:#3d78e6;
  --ouro:#d9ab3c;--ouro-claro:#f6dd90;--ouro-escuro:#8a6416;
  --lobo:#2fcfbd;--lobo-escuro:#0d5f66;
  --giz:#eef1f5;--nevoa:#9fabbd;--brasa:#ef6f62;
  --linha:rgba(217,171,60,.26);--linha-fraca:rgba(159,171,189,.16);
  --f-tit:"Big Shoulders Display","Arial Narrow","Liberation Sans Narrow",Impact,sans-serif;
  --f-txt:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --raio:10px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;color:var(--giz);font:400 16px/1.5 var(--f-txt);
  background:radial-gradient(120% 50% at 50% -8%,rgba(11,42,99,.6),transparent 62%) no-repeat,#000}
[hidden]{display:none!important}
a{color:var(--lobo)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
.ouro{color:var(--ouro)}
@supports (-webkit-background-clip:text) or (background-clip:text){
  .ouro{background:linear-gradient(180deg,var(--ouro-claro),var(--ouro) 55%,var(--ouro-escuro));-webkit-background-clip:text;background-clip:text;color:transparent}
}
:focus-visible{outline:2px solid var(--lobo);outline-offset:2px}

/* ---------- topo ---------- */
.topo{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding-top:18px;padding-bottom:12px}
.marca{display:flex;align-items:center;gap:12px;min-width:0}
.marca svg{width:46px;height:55px;flex:none}
.marca img{width:68px;height:66px;flex:none;object-fit:contain;display:block}
.logo-grande{width:min(80vw,340px);height:auto;display:block}
.marca h1{margin:0;font:800 38px/.9 var(--f-tit);letter-spacing:.01em}
.marca small{display:block;margin-top:5px;color:var(--nevoa);font-size:13px}
.sync{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--nevoa)}
.sync i{width:9px;height:9px;border-radius:50%;background:var(--nevoa);flex:none}
.sync.ok i{background:var(--lobo);box-shadow:0 0 0 3px rgba(47,207,189,.2)}
.sync.erro{color:#ffb9b1}.sync.erro i{background:var(--brasa);box-shadow:0 0 0 3px rgba(239,111,98,.22)}
.sync.demo i{background:var(--ouro)}
.sync.local i{background:var(--azul)}

/* ---------- abas ---------- */
.abas{position:sticky;top:0;z-index:20;background:rgba(0,0,0,.93);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--linha)}
.abas .wrap{display:flex;gap:2px;padding-left:8px;padding-right:8px}
.abas a{flex:1 1 0;min-width:0;text-align:center;white-space:nowrap;padding:15px 2px 12px;color:var(--nevoa);text-decoration:none;font:800 clamp(14px,4vw,21px)/1 var(--f-tit);letter-spacing:.01em;border-bottom:3px solid transparent}
.abas a[aria-current=page]{color:var(--ouro-claro);border-bottom-color:var(--ouro)}
.abas a:focus-visible{outline-offset:-4px}

/* ---------- placar (totais) ---------- */
.placar{display:grid;grid-template-columns:repeat(3,1fr);margin:20px 0 8px;border-top:1px solid var(--linha);border-bottom:1px solid var(--linha)}
.placar div{padding:14px 4px 12px;text-align:center;border-left:1px solid var(--linha-fraca);border-top:1px solid var(--linha-fraca)}
.placar div:nth-child(-n+3){border-top:0}
.placar div:nth-child(3n+1){border-left:0}
.placar b{display:block;color:var(--ouro-claro);font:800 clamp(34px,10.5vw,54px)/1 var(--f-tit);font-variant-numeric:tabular-nums}
.so-leitor{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#tab-rank{min-width:780px}
#tab-lanc{min-width:600px}
#tab-lanc .c-nome{left:0}
.placar span{display:block;margin-top:5px;color:var(--nevoa);font-size:13px;line-height:1.2}
@media(min-width:860px){
  .placar{grid-template-columns:repeat(6,1fr)}
  .placar div{border-top:0}
  .placar div:nth-child(n){border-left:1px solid var(--linha-fraca)}
  .placar div:first-child{border-left:0}
}
.meta{margin:10px 0 4px;color:var(--nevoa);font-size:13px}
h2.tela{margin:26px 0 4px;font:800 clamp(28px,7vw,40px)/1 var(--f-tit)}

/* ---------- campos ---------- */
.barra{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin:16px 0 14px}
.campo{display:flex;flex-direction:column;gap:6px;flex:1 1 150px;min-width:0}
.campo label{font-size:13px;color:var(--nevoa)}
input,select{width:100%;min-height:44px;padding:10px 12px;font:500 16px var(--f-txt);color:var(--giz);background:var(--escudo);border:1px solid var(--linha);border-radius:var(--raio)}
input::placeholder{color:#74839b}
input[type=date]{color-scheme:dark}
.btn{min-height:44px;padding:10px 16px;font:700 15px var(--f-txt);color:var(--giz);background:transparent;border:1px solid var(--linha);border-radius:var(--raio);cursor:pointer}
.btn:hover{border-color:var(--ouro)}
.btn.principal{color:#1a1200;background:linear-gradient(180deg,var(--ouro-claro),var(--ouro));border-color:transparent}
.btn.link{border:0;min-height:36px;padding:6px 2px;color:var(--lobo);font-weight:600;text-decoration:underline;text-underline-offset:3px}

/* ---------- tabelas ---------- */
.rolagem{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--linha);border-radius:var(--raio);background:#000}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:15px}
th,td{padding:9px 8px;text-align:center;white-space:nowrap;border-bottom:1px solid var(--linha-fraca);font-variant-numeric:tabular-nums}
tbody tr:last-child td{border-bottom:0}
thead th{background:var(--escudo);color:var(--nevoa);font-weight:600;font-size:13px;padding:4px 6px}
thead th button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:4px;min-height:38px;padding:0 4px;box-sizing:border-box}
thead th button:focus-visible{outline:2px solid var(--lobo);border-radius:4px}
thead th[aria-sort] button{color:var(--ouro-claro)}
thead th[aria-sort=ascending] button::after{content:"▲";font-size:9px}
thead th[aria-sort=descending] button::after{content:"▼";font-size:9px}
td{background:#000}
tbody tr:hover td{background:#04122b}
.c-pos{position:sticky;left:0;z-index:2;width:46px;min-width:46px}
.c-nome{position:sticky;left:46px;z-index:2;text-align:left;min-width:128px;box-shadow:1px 0 0 var(--linha-fraca)}
thead .c-pos,thead .c-nome{z-index:3}
.nome-btn{all:unset;cursor:pointer;font-weight:600;color:var(--giz);border-bottom:1px dotted var(--nevoa)}
.nome-btn:hover{color:var(--ouro-claro)}
.nome-btn:focus-visible{outline:2px solid var(--lobo);outline-offset:2px;border-radius:3px}
.pos{display:inline-grid;place-items:center;width:28px;height:32px;font:800 17px/1 var(--f-tit);color:var(--nevoa)}
.pos.pd{color:var(--giz);background:var(--escudo-2);clip-path:polygon(50% 0,100% 12%,100% 58%,50% 100%,0 58%,0 12%)}
.pos.p1{background:linear-gradient(180deg,var(--ouro-claro),var(--ouro-escuro));color:#1a1200}
.pos.p2{background:linear-gradient(180deg,#7ea4f0,#264b94)}
.pos.p3{background:linear-gradient(180deg,#4fe0cf,var(--lobo-escuro));color:#021613}
.num-forte{font-weight:700;color:var(--ouro-claro)}
.ap{min-width:76px;background-repeat:no-repeat;background-image:linear-gradient(90deg,rgba(47,207,189,.24),rgba(47,207,189,.24));background-size:var(--w,0%) 100%}
.forma{display:inline-flex;gap:3px;vertical-align:middle}
.ch{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 3px;border-radius:5px;font:800 13px/1 var(--f-tit);letter-spacing:.02em}
.ch-V{background:var(--lobo);color:#031a18}
.ch-E{background:var(--ouro);color:#1c1400}
.ch-D{background:var(--brasa);color:#2a0805}
.ch-WO{background:#8d99ab;color:#0a0f16}
.ch-MVP{background:transparent;color:var(--ouro-claro);border:1px solid var(--ouro)}
.ch-vazio{border:1px dashed var(--linha-fraca)}
.vazio-msg{padding:28px 16px;text-align:center;color:var(--nevoa)}
.fora{margin-left:6px;padding:1px 6px;border-radius:5px;font-size:11px;font-weight:700;color:#2a0805;background:var(--brasa)}
.semdata{color:#74839b;font-style:italic}
.mais{display:flex;justify-content:center;margin:14px 0}

/* ---------- avisos ---------- */
.aviso{margin:14px 0 0;padding:11px 14px;border:1px solid var(--linha);border-radius:var(--raio);background:rgba(217,171,60,.09);font-size:14px}
.aviso.erro{border-color:rgba(239,111,98,.55);background:rgba(239,111,98,.1)}
.aviso b{color:var(--ouro-claro)}

/* ---------- melhor do mês ---------- */
.craque{display:grid;justify-items:center;gap:6px;text-align:center;padding:14px 0 10px}
.craque svg.escudo{width:min(66vw,250px);height:auto;filter:drop-shadow(0 18px 38px rgba(61,120,230,.3))}
.craque h2{margin:10px 0 0;font:800 clamp(46px,14vw,82px)/.92 var(--f-tit)}
.craque .mes{margin:0;color:var(--nevoa)}
.craque .auto{margin:4px 0 0;font-size:13px;color:var(--nevoa);max-width:42ch}
.nums,.hist-nums{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--linha-fraca);border:1px solid var(--linha);border-radius:var(--raio);overflow:hidden}
.nums{width:100%;max-width:560px;margin:16px 0 0}
.nums div,.hist-nums div{background:#000;padding:10px 4px;text-align:center}
.nums b,.hist-nums b{display:block;font:800 28px/1 var(--f-tit)}
.nums span,.hist-nums span{font-size:12px;color:var(--nevoa)}
@media(min-width:640px){.nums,.hist-nums{grid-template-columns:repeat(8,1fr)}.nums{max-width:640px}}
.top3{margin:30px auto 0;max-width:560px}
.top3 h3{margin:0 0 6px;font:800 26px/1 var(--f-tit)}
.top3 ol{list-style:none;margin:0;padding:0}
.top3 li{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--linha-fraca)}
.top3 li:last-child{border-bottom:0}
.top3 .quem{flex:1;min-width:0}
.top3 .quem b{display:block;font-size:18px}
.top3 .quem span{color:var(--nevoa);font-size:13px}
.top3 .pts{font:800 30px/1 var(--f-tit);text-align:right}
.top3 .pts small{display:block;font:500 12px var(--f-txt);color:var(--nevoa)}
.brilho-g{animation:varrer 1.5s cubic-bezier(.3,.6,.3,1) .35s 1 both}
@keyframes varrer{from{transform:translateX(-80px)}to{transform:translateX(190px)}}

/* ---------- diálogos ---------- */
dialog{width:min(100%,660px);max-width:none;max-height:90vh;margin:auto auto 0;padding:0;color:var(--giz);background:var(--escudo);border:1px solid var(--linha);border-radius:18px 18px 0 0;overflow:hidden}
dialog[open]{display:flex;flex-direction:column}
dialog::backdrop{background:rgba(0,0,0,.74)}
@media(min-width:700px){dialog{margin:auto;border-radius:18px}}
.dlg-cab{display:flex;align-items:flex-start;gap:12px;padding:18px 18px 12px;border-bottom:1px solid var(--linha)}
.dlg-cab h2{flex:1;margin:0;font:800 34px/1 var(--f-tit)}
.dlg-cab p{margin:4px 0 0;color:var(--nevoa);font-size:13px;font-family:var(--f-txt);font-weight:400}
.fechar{all:unset;cursor:pointer;flex:none;width:44px;height:44px;display:grid;place-items:center;font-size:22px;color:var(--nevoa);border-radius:50%}
.fechar:hover{color:var(--giz)}
.fechar:focus-visible{outline:2px solid var(--lobo)}
.dlg-corpo{padding:14px 18px 22px;overflow:auto}
.hist-nums{margin:0 0 14px}
.hist-nums div{background:var(--escudo)}
.hist-nums b{font-size:24px}
.hist-lista{list-style:none;margin:10px 0 0;padding:0}
.hist-lista li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--linha-fraca);font-size:14px}
.hist-lista .d{flex:none;width:86px;color:var(--nevoa)}
.hist-lista .p{margin-left:auto;color:var(--nevoa);font-size:12px}
.form-senha{display:grid;gap:12px}
.erro-txt{margin:0;color:#ffb9b1;font-size:14px}
.passos{margin:0 0 12px;padding-left:20px;color:var(--nevoa);font-size:14px}

/* ---------- rodapé ---------- */
.rodape{display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:space-between;align-items:center;margin-top:38px;padding-top:16px;padding-bottom:30px;border-top:1px solid var(--linha-fraca);color:var(--nevoa);font-size:13px}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

function pct(pts, jogos) {
  if (!jogos) return "0,0%";
  const t = Math.floor((pts * 2000 + jogos * 3) / (jogos * 6));
  return `${Math.floor(t / 10)},${t % 10}%`;
}
function processar(lr, jr) {
  const L = lerLancamentos(lr), nomes = lerJogadores(jr);
  const r = calcular(L.lanc, nomes);
  return { meta: L.meta, lanc: L.lanc, jog: r.jog, rank: ranquear(r.jog), tot: r.tot, fora: r.fora };
}

/* ---------- links ---------- */
function normalizarLink(u) {
  u = String(u ?? "").trim();
  if (!u) return "";
  let m = u.match(/^https?:\/\/docs\.google\.com\/spreadsheets\/d\/e\/([^/?#]+)\/pub(?:html)?(\?[^#]*)?/);
  if (m) {
    const q = new URLSearchParams(m[2] || "");
    q.set("output", "csv"); q.delete("widget"); q.delete("headers");
    return `https://docs.google.com/spreadsheets/d/e/${m[1]}/pub?${q}`;
  }
  m = u.match(/^https?:\/\/docs\.google\.com\/spreadsheets\/d\/([A-Za-z0-9_-]{20,})\/(?:edit|view|htmlview)/);
  if (m) { const g = (u.match(/[?#&]gid=(\d+)/) || [])[1]; return `https://docs.google.com/spreadsheets/d/${m[1]}/export?format=csv${g ? "&gid=" + g : ""}`; }
  return u;
}
async function baixar(url) {
  const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 15000);
  try {
    const r = await fetch(url + (url.includes("?") ? "&" : "?") + "_=" + Date.now(), { cache: "no-store", signal: ctl.signal });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const t = await r.text();
    if (/^\s*<(!doctype|html)/i.test(t)) throw new Error("A resposta não é CSV (a planilha está publicada?)");
    return t;
  } finally { clearTimeout(to); }
}

/* ---------- senha (hash SHA-256 com sal; é só uma trava simples) ---------- */
async function hashSenha(s) {
  if (!globalThis.crypto || !crypto.subtle) throw new Error("Abra o site pelo endereço https para usar o painel.");
  const d = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(CONFIG.SENHA_SAL + ":" + s));
  return [...new Uint8Array(d)].map(x => x.toString(16).padStart(2, "0")).join("");
}

/* ---------- leitura de .xlsx sem biblioteca (zip + xml) ---------- */
async function lerXlsx(buf) {
  const u8 = new Uint8Array(buf), dv = new DataView(buf), dec = new TextDecoder();
  let eo = -1;
  for (let i = u8.length - 22; i >= Math.max(0, u8.length - 65557); i--) if (dv.getUint32(i, true) === 0x06054b50) { eo = i; break; }
  if (eo < 0) throw new Error("Esse arquivo não parece ser uma planilha .xlsx");
  const n = dv.getUint16(eo + 10, true), ents = {};
  let p = dv.getUint32(eo + 16, true);
  for (let k = 0; k < n && dv.getUint32(p, true) === 0x02014b50; k++) {
    const nl = dv.getUint16(p + 28, true), el = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true);
    ents[dec.decode(u8.subarray(p + 46, p + 46 + nl))] = { m: dv.getUint16(p + 10, true), c: dv.getUint32(p + 20, true), o: dv.getUint32(p + 42, true) };
    p += 46 + nl + el + cl;
  }
  const ler = async nome => {
    const e = ents[nome]; if (!e) return null;
    const s = e.o + 30 + dv.getUint16(e.o + 26, true) + dv.getUint16(e.o + 28, true);
    const dados = u8.subarray(s, s + e.c);
    if (e.m === 0) return dec.decode(dados);
    const fluxo = new Blob([dados]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
    return dec.decode(await new Response(fluxo).arrayBuffer());
  };
  const xml = async nome => { const t = await ler(nome); return t ? new DOMParser().parseFromString(t, "application/xml") : null; };
  const wb = await xml("xl/workbook.xml"), rels = await xml("xl/_rels/workbook.xml.rels");
  if (!wb || !rels) throw new Error("Planilha .xlsx incompleta");
  const alvo = {};
  for (const r of rels.getElementsByTagName("Relationship")) alvo[r.getAttribute("Id")] = r.getAttribute("Target");
  const textos = [], ss = await xml("xl/sharedStrings.xml");
  if (ss) for (const si of ss.getElementsByTagName("si")) textos.push([...si.getElementsByTagName("t")].map(t => t.textContent).join(""));
  const colNum = ref => { let c = 0; for (const ch of ref.replace(/\d+/g, "")) c = c * 26 + ch.charCodeAt(0) - 64; return c - 1; };
  const abas = {};
  for (const s of wb.getElementsByTagName("sheet")) {
    let t = alvo[s.getAttribute("r:id")]; if (!t) continue;
    const sh = await xml(t.replace(/^\/?(xl\/)?/, "xl/")); if (!sh) continue;
    const linhas = [];
    for (const c of sh.getElementsByTagName("c")) {
      const ref = c.getAttribute("r"); if (!ref) continue;
      const r = parseInt(ref.replace(/\D+/g, ""), 10) - 1, tp = c.getAttribute("t"), v = c.getElementsByTagName("v")[0];
      let val = "";
      if (tp === "s") val = textos[+(v ? v.textContent : -1)] ?? "";
      else if (tp === "inlineStr") val = [...c.getElementsByTagName("t")].map(x => x.textContent).join("");
      else if (v) val = v.textContent;
      (linhas[r] ??= [])[colNum(ref)] = val;
    }
    abas[s.getAttribute("name")] = Array.from(linhas, l => Array.from(l || [], x => x ?? ""));
  }
  return abas;
}

/* =====================================================================
   SINCRONIZAÇÃO, PAINEL DE ATUALIZAÇÃO E INÍCIO
   ===================================================================== */
let timer = 0;
const aplicarDados = dados => { estado.dados = dados; renderTudo(); };
const intervaloMs = () => Math.max(5, +CONFIG.INTERVALO_SEGUNDOS || 30) * 1000;

async function sincronizar() {
  if (estado.sincronizando || !estado.online || estado.origem === "local") return;
  estado.sincronizando = true; estado.ultimaTentativa = Date.now();
  try {
    const [tl, tj] = await Promise.all([baixar(estado.links.l), baixar(estado.links.j)]);
    const sig = tl + "\u0000" + tj;
    if (sig !== estado.assinatura) {
      const lr = parseCSV(tl, detectarSep(tl)), jr = parseCSV(tj, detectarSep(tj));
      const dados = processar(lr, jr);            /* lança erro se o formato não for o esperado */
      estado.assinatura = sig;
      gravarLS("alpha:ultimo", { lanc: lr, jog: jr, quando: Date.now() });
      estado.erro = false; estado.ultimaSync = new Date(); estado.dadosDe = quandoTxt(Date.now());
      aplicarDados(dados);
    } else {
      estado.erro = false; estado.ultimaSync = new Date(); estado.dadosDe = quandoTxt(Date.now());
      renderAvisos(); atualizarStatus();
    }
  } catch (e) {
    estado.erro = true; console.warn("Falha ao ler a planilha:", e);
    renderAvisos(); atualizarStatus();
  } finally { estado.sincronizando = false; }
}
function agendar() {
  clearTimeout(timer);
  if (estado.online && estado.origem !== "local") timer = setTimeout(tique, intervaloMs());
}
async function tique() { if (document.visibilityState === "visible") await sincronizar(); agendar(); }

  }
  const loc = estado.origem === "local";
  c.innerHTML = `<div class="aviso" style="margin-top:0"><b>Vale só neste aparelho.</b> Quem abrir o site em outro aparelho continua vendo a planilha online. Para atualizar para todos, edite a planilha no Google Sheets: o site acompanha sozinho a cada ${Math.round(intervaloMs() / 1000)} segundos.</div>` +
    '<ol class="passos" style="margin-top:14px"><li>No Google Sheets, abra Arquivo, Fazer download, Microsoft Excel (.xlsx).</li><li>Escolha o arquivo abaixo (ou os dois arquivos .csv, Lançamentos e Jogadores).</li></ol>' +
    '<div class="campo"><label for="arq">Arquivo da planilha</label><input id="arq" type="file" accept=".xlsx,.csv,text/csv" multiple></div>' +
    `<p class="meta" id="adm-msg" role="status">${loc ? "Usando: " + esc(estado.fonte) : "Nenhum arquivo carregado."}</p>` +
    `<div style="display:flex;gap:10px;flex-wrap:wrap">${loc ? `<button class="btn" type="button" id="voltar-online">${estado.online ? "Voltar à planilha online" : "Remover a planilha carregada"}</button>` : ""}<button class="btn link" type="button" id="adm-sair">Bloquear painel</button></div>`;
}
async function carregarArquivos(files) {
  const msg = $("adm-msg"); msg.textContent = "Lendo o arquivo…";
  try {
    let lr = null, jr = null;
    const nome = [...files].map(f => f.name).join(" + ");
    for (const f of files) {
      if (/\.xlsx$/i.test(f.name)) {
        const abas = await lerXlsx(await f.arrayBuffer());
        for (const [n, rows] of Object.entries(abas)) { const k = norm(n); if (k.startsWith("lanc")) lr = rows; else if (k === "jogadores") jr = rows; }
        if (!lr || !jr) { const v = Object.values(abas); lr = lr || v[0]; jr = jr || v[1]; }
      } else {
        const t = await f.text(), rows = parseCSV(t, detectarSep(t));
        try { lerLancamentos(rows); lr = rows; }
        catch { try { lerJogadores(rows); jr = rows; } catch { throw new Error(`o arquivo ${f.name} não parece ser a aba Lançamentos nem a aba Jogadores.`); } }
      }
    }
    if (!lr || !jr) throw new Error("faltou uma das abas. Envie o .xlsx completo ou os dois arquivos .csv.");
    const dados = processar(lr, jr);
    clearTimeout(timer);
    estado.origem = "local"; estado.fonte = nome;
    gravarLS("alpha:local", { nome, lanc: lr, jog: jr, quando: Date.now() });
    aplicarDados(dados); renderAdmin();
    $("adm-msg").textContent = `Pronto: ${dados.tot.lancadas} lançamentos e ${dados.tot.inscritos} jogadores.`;
  } catch (e) { msg.textContent = "Não deu certo: " + e.message; }
}
function voltarOnline() { apagarLS("alpha:local"); location.reload(); }

/* ---------- navegação ---------- */
const TELAS = ["classificacao", "melhor", "lancamentos"];
function rotear() {
  let t = (location.hash || "#classificacao").slice(1);
  if (!TELAS.includes(t)) t = "classificacao";
  $("tela-classificacao").hidden = t !== "classificacao";
  $("tela-melhor").hidden = t !== "melhor";
  $("tela-lancamentos").hidden = t !== "lancamentos";
  document.querySelectorAll(".abas a").forEach(a => {
    if (a.getAttribute("href") === "#" + t) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  });
}

/* ---------- eventos ---------- */
document.addEventListener("click", e => {
  const t = e.target;
  let b;
  if ((b = t.closest("[data-nome]"))) return abrirHist(b.dataset.nome);
  if ((b = t.closest("[data-ord]"))) return ordenarPor(b.dataset.ord);
  if ((b = t.closest("[data-fechar]"))) return b.closest("dialog").close();
  if (t.tagName === "DIALOG") return t.close();
  if (t.closest("#voltar-online")) return voltarOnline();
  if (t.closest("#adm-sair")) { estado.admin = false; return renderAdmin(); }
  if (t.closest("#abrir-admin")) { renderAdmin(); $("dlg-admin").showModal(); }
});
document.addEventListener("submit", async e => {
  if (e.target.id !== "form-senha") return;
  e.preventDefault();
  const erro = $("senha-erro"); erro.hidden = true;
  try {
    if (await hashSenha($("senha").value.trim()) === CONFIG.SENHA_HASH) { estado.admin = true; renderAdmin(); }
    else { erro.textContent = "Senha incorreta."; erro.hidden = false; $("senha").select(); }
  } catch (x) { erro.textContent = x.message; erro.hidden = false; }
});
document.addEventListener("change", e => { if (e.target.id === "arq" && e.target.files.length) carregarArquivos(e.target.files); });
$("busca").addEventListener("input", e => { estado.busca = e.target.value; renderRank(); });
const filtro = () => { estado.fLanc.de = $("f-de").value; estado.fLanc.ate = $("f-ate").value; estado.fLanc.nome = $("f-nome").value; estado.fLanc.limite = 300; renderLanc(); };
["f-de", "f-ate", "f-nome"].forEach(id => $(id).addEventListener("input", filtro));
$("f-limpar").addEventListener("click", () => { ["f-de", "f-ate", "f-nome"].forEach(id => { $(id).value = ""; }); filtro(); });
$("lanc-mais").addEventListener("click", () => { estado.fLanc.limite += 300; renderLanc(); });
addEventListener("hashchange", () => { rotear(); scrollTo(0, 0); });
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && estado.online && estado.origem !== "local" && Date.now() - estado.ultimaTentativa >= intervaloMs()) { clearTimeout(timer); tique(); }
});
addEventListener("online", () => { if (estado.online && estado.origem !== "local") sincronizar(); });

/* ---------- início ---------- */
function iniciar() {
  if (CONFIG.LOGO) {
    const im = new Image();
    im.alt = "Escudo do Alpha Team";
    im.onload = () => { estado.logoOk = true; $("logo-box").replaceChildren(im); if (estado.dados) renderMelhor(); };
    im.src = CONFIG.LOGO; /* se a imagem não existir, continua o escudo desenhado */
  }
  estado.links = { l: normalizarLink(CONFIG.LANCAMENTOS_CSV), j: normalizarLink(CONFIG.JOGADORES_CSV) };
  estado.online = !!(estado.links.l && estado.links.j);
  let ok = false;
  const loc = lerLS("alpha:local");
  if (loc) { try { estado.origem = "local"; estado.fonte = loc.nome || "arquivo"; aplicarDados(processar(loc.lanc, loc.jog)); ok = true; } catch { apagarLS("alpha:local"); } }
  if (!ok) estado.origem = estado.online ? "online" : "demo";
  if (!ok && estado.online) {
    const u = lerLS("alpha:ultimo");
    if (u) { try { aplicarDados(processar(u.lanc, u.jog)); estado.dadosDe = quandoTxt(u.quando); ok = true; } catch { /* usa a cópia embutida */ } }
  }
  if (!ok) aplicarDados(processar(parseCSV(SNAPSHOT.lancamentos), parseCSV(SNAPSHOT.jogadores)));
  rotear(); agendar();
  if (estado.online && estado.origem !== "local") sincronizar();
}
window.__alpha = { parseCSV, detectarSep, parseData, lerLancamentos, lerJogadores, calcular, ranquear, processar, normalizarLink, pct, lerXlsx, estado, sincronizar };
iniciar();

</script>
